<div id="lightbox" class="lightbox" aria-modal="true" role="dialog" aria-label="Image viewer">
                <button class="lightbox__close" id="lightboxClose" aria-label="Close">✕</button>
                <div class="lightbox__stage">
                    <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Previous image"><img class="hero_banner_arrow" src="../../assets/images/icons/arrow-down-solid.svg" alt="arrow"></button>
                    <div class="lightbox__content">
                    <img class="lightbox__img" id="lightboxImg" src="" alt="">
                   
                    </div>
                     <button class="lightbox__zoom" id="lightboxZoom" aria-label="Zoom image">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        <line x1="11" y1="8" x2="11" y2="14"/>
                        <line x1="8" y1="11" x2="14" y2="11"/>
                    </svg>
                    </button>
                    <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Next image"><img class="hero_banner_arrow" src="../../assets/images/icons/arrow-down-solid.svg" alt="arrow"></button>
                </div>
                
                <div class="lightbox__counter" id="lightboxCounter">1 / 1</div>
                <div class="lightbox__strip" id="lightboxStrip"></div>
            </div>
            <div id="lightboxBackdrop" class="lightbox__backdrop"></div>
